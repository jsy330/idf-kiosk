# Netlify가 이 저장소를 배포할 때 쓰는 설정 (빌드 과정 없음, kiosk 폴더를 그대로 올림)
[build]
  publish = "kiosk"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
