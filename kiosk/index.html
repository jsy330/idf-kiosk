<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IDF 키오스크</title>
  <meta name="theme-color" content="#f2f2ee" />
  <link rel="icon" href="images/logo.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // 테마를 첫 렌더 전에 적용해서 깜빡임 방지
    (function () {
      var q = new URLSearchParams(location.search).get('theme');
      var t = q || localStorage.getItem('idf-theme') || 'light';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" id="brand" aria-label="홈으로">
        <img src="images/logo.png" alt="IDF Idea Dream Factory" class="logo" draggable="false" />
      </button>
      <div class="topbar-right">
        <div class="clock" aria-live="off">
          <span id="clock-time">--:--</span>
          <span id="clock-date"></span>
        </div>
        <button class="icon-btn" id="theme-btn" aria-label="라이트/다크 모드 전환">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
        </button>
        <button class="home-btn" id="home-btn" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg>
          <span>처음으로</span>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>

    <footer class="footer">
      <span>Idea Dream Factory · 학생회관 205호</span>
    </footer>
  </div>

  <!-- 관리자 패널: 로고를 3초간 길게 누르면 열림 -->
  <dialog id="admin" class="admin">
    <form method="dialog" class="admin-inner">
      <h2>관리자 설정</h2>
      <p class="muted">장비·공구 CSV를 올리면 이 기기에만 저장됩니다. 모든 키오스크에 적용하려면 <code>data/equipment.csv</code>를 교체해서 다시 배포하세요.</p>
      <label class="file-btn">
        장비/공구 CSV 선택
        <input type="file" id="admin-csv" accept=".csv,text/csv" hidden />
      </label>
      <p id="admin-status" class="muted"></p>
      <div class="admin-actions">
        <button type="button" id="admin-reset" class="btn ghost">기기 저장 데이터 삭제</button>
        <button type="button" id="admin-reload" class="btn ghost">새로고침</button>
        <button class="btn">닫기</button>
      </div>
    </form>
  </dialog>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
